version: '3.8'

services:
  spotter-ai:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models  # Mount models directory
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
